<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>张凯 | Kai Zhang — 医学数据科学与临床研究方法学</title>
  <meta name="description" content="张凯（Kai Zhang）的学术主页：目标试验模拟、因果推断、真实世界证据与肝胆肿瘤临床研究。">
  <meta name="author" content="Kai Zhang">
  <link rel="canonical" href="https://zhangkaicr.github.io/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">跳转到正文</a>

  <div class="mobile-bar">
    <a class="mobile-bar__name" href="#about" data-bind="name">张凯</a>
    <div class="seg seg--small" role="group" aria-label="Language">
      <button type="button" data-lang-btn="zh">中文</button>
      <button type="button" data-lang-btn="en">EN</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__inner">
        <a class="avatar" href="#about" aria-label="Home">
          <svg viewBox="0 0 120 120" role="img" aria-label="KZ monogram">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1b7a83"/>
                <stop offset="100%" stop-color="#0d4c58"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="60" fill="url(#g)"/>
            <text x="60" y="76" text-anchor="middle" fill="#fff"
                  font-family="Georgia, 'Times New Roman', serif"
                  font-size="44" letter-spacing="2">KZ</text>
          </svg>
        </a>

        <h1 class="sidebar__name" data-bind="name">张凯</h1>
        <p class="sidebar__role" data-bind="role"></p>
        <p class="sidebar__affil" data-bind="affiliation"></p>
        <p class="sidebar__location" data-bind="location"></p>

        <div class="sidebar__links" id="sidebar-links"></div>

        <div class="sidebar__lang">
          <span class="sidebar__lang-label" data-i18n="langLabel">语言</span>
          <div class="seg" role="group" aria-label="Language">
            <button type="button" data-lang-btn="zh">中文</button>
            <button type="button" data-lang-btn="en">EN</button>
          </div>
        </div>

        <p class="sidebar__orcid">
          <span data-i18n="orcidLabel">ORCID iD</span>
          <a id="orcid-link" href="https://orcid.org/0000-0002-2292-3696"
             target="_blank" rel="noopener noreferrer">0000-0002-2292-3696</a>
        </p>
      </div>
    </aside>

    <main class="main" id="main">
      <nav class="topnav" id="topnav" aria-label="Sections"></nav>

      <section class="section hero" id="about">
        <p class="eyebrow" data-i18n="heroEyebrow">学术主页 · Academic Homepage</p>
        <h2 class="hero__title" id="hero-title"></h2>
        <p class="hero__lead" id="hero-lead"></p>
        <div class="hero__actions" id="hero-actions"></div>
      </section>

      <section class="section" id="research">
        <h2 class="section__title" data-i18n="researchTitle">研究方向</h2>
        <p class="section__intro" data-i18n="researchIntro"></p>
        <div class="cards" id="research-grid"></div>
      </section>

      <section class="section" id="about-detail">
        <h2 class="section__title" data-i18n="aboutTitle">关于我</h2>
        <div class="prose" id="about-body"></div>
      </section>

      <section class="section" id="experience">
        <h2 class="section__title" data-i18n="expTitle">教育与工作经历</h2>
        <p class="section__intro" data-i18n="expIntro"></p>
        <div id="experience-body"></div>
      </section>

      <section class="section" id="publications">
        <h2 class="section__title" data-i18n="pubTitle">论文成果</h2>
        <p class="section__intro" id="pub-intro"></p>
        <div class="pub-tools">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
            <input type="search" id="pub-filter" autocomplete="off" data-i18n-ph="filterPlaceholder" placeholder="筛选论文…">
          </label>
          <span class="pub-count" id="pub-count"></span>
        </div>
        <ol class="pub-list" id="pub-list"></ol>
        <p class="section__foot" id="pub-foot"></p>
      </section>

      <section class="section" id="outreach">
        <h2 class="section__title" data-i18n="outreachTitle">教学与科普</h2>
        <p class="section__intro" data-i18n="outreachIntro"></p>
        <div class="timeline" id="teaching-list"></div>
        <h3 class="subhead" data-i18n="accountsTitle">科普平台与写作</h3>
        <div class="accounts" id="outreach-list"></div>
      </section>

      <section class="section" id="contact">
        <h2 class="section__title" data-i18n="contactTitle">联系方式</h2>
        <div class="prose" id="contact-body"></div>
        <div class="contact-links" id="contact-links"></div>
      </section>

      <footer class="footer">
        <p id="footer-line"></p>
        <p class="footer__tech" data-i18n="footerTech">版式参考 academicpages / Minimal Mistakes · 中英双语一键切换</p>
      </footer>
    </main>
  </div>

  <script src="assets/content.js"></script>
  <script src="assets/app.js"></script>

</html>
